    <text x="20" y="56" class="label-langs">JavaScript</text><rect x="90" y="46" width="180" height="8" rx="4" class="track-langs"/><rect x="90" y="46" width="180" height="8" rx="4" fill="#F7DF1E"/><text x="280" y="56" text-anchor="end" class="label-langs">100.0%</text></g>
