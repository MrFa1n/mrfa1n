    .title-langs { fill: #24292f; font-weight: 700; font-size: 15px; }
    .label-langs { fill: #57606a; font-size: 12px; }
    .value-langs { fill: #24292f; font-weight: 700; font-size: 20px; }
    .track-langs { fill: #d0d7de; }
