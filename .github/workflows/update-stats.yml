name: Update profile stats

on:
  schedule:
    # Weekly, Monday 03:00 UTC — the README only shows a snapshot, so there's
    # no need to refresh more often than that.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: MrFa1n
          REPO_NAME: mrfa1n
        run: node scripts/update-stats.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          git diff --cached --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push
